name: Record authentic gameplay preview

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - ".github/workflows/record-gameplay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameplay-preview-recording
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p static

      - name: Start VOID SPACE locally
        run: |
          nohup python -c "from app import app; app.run(host='127.0.0.1', port=5000, debug=False)" > /tmp/void-space.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5000/ >/dev/null

      - name: Record real game-engine footage
        run: |
          cat > /tmp/record_gameplay.py <<'PY'
          import asyncio
          import os
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  context = await browser.new_context(
                      viewport={"width": 1440, "height": 900},
                      device_scale_factor=1,
                      record_video_dir="/tmp/recorded",
                      record_video_size={"width": 1440, "height": 900},
                  )
                  page = await context.new_page()
                  await page.goto("http://127.0.0.1:5000/?record=1", wait_until="domcontentloaded")
                  await page.wait_for_timeout(22000)
                  video = page.video
                  await context.close()
                  await browser.close()
                  path = await video.path()
                  target = Path("static/void-space-gameplay.webm")
                  target.write_bytes(Path(path).read_bytes())
                  if target.stat().st_size < 100_000:
                      raise RuntimeError(f"Gameplay recording unexpectedly small: {target.stat().st_size} bytes")
                  print(f"Saved real gameplay capture: {target} ({target.stat().st_size} bytes)")

          asyncio.run(main())
          PY
          python /tmp/record_gameplay.py

      - name: Commit recorded footage to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/void-space-gameplay.webm
          if git diff --cached --quiet; then
            echo "No footage changes to commit."
            exit 0
          fi
          git commit -m "Add recorded VOID SPACE gameplay footage"
          # Code/docs can be committed while the 22-second capture is running.
          # Rebase the generated binary on the latest main and retry transient push races.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main update (attempt $attempt); retrying."
            sleep 2
          done
          echo "Could not publish the recorded footage after three attempts." >&2
          exit 1
