name: VOID SPACE smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Check expansion JavaScript syntax
        run: node --check static/void-expansion.js && node --check static/void-universe.js && node --check static/void-3d.js
      - name: Run Flask smoke tests
        run: python -m unittest discover -s tests -v
